$kind: http-request
name: Register
method: POST
url: '{{baseUrl}}/api/v1/user/register'
description: Register a new user. Requires email, password (6-16 chars), and a 6-digit verification code.
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "password": "password123",
      "code": "123456"
    }
