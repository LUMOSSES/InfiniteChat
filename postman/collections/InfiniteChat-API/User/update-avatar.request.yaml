$kind: http-request
name: Update Avatar
method: PATCH
url: '{{baseUrl}}/api/v1/user/avatar'
description: Update the user's avatar. Requires a JWT token in the Authorization header.
order: 4000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: '{{token}}'
body:
  type: json
  content: |-
    {
      "avatarUrl": "https://example.com/avatar.png"
    }
